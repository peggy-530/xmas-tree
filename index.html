<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   把網頁原本用的 window.claude.use('db' | 'user' | 'room' | 'downloads')
   換成 Supabase。訪客不用註冊：瀏覽器自己產生一把隨機鑰匙。
   ===================================================================== */
(() => {
const SUPABASE_URL = 'https://veuizjjgkgslngovqbqs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_450KWzLiHSVGMps0GCU6lw_lwqWEXhx';

// ---------- 這個瀏覽器的身分 ----------
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let token = lsGet('xmas-token');
if (!token || token.length < 32) {
  token = [...crypto.getRandomValues(new Uint8Array(32))].map(b => b.toString(16).padStart(2, '0')).join('');
  lsSet('xmas-token', token);
}
const tabKey = Math.random().toString(36).slice(2, 12);
const uidP = crypto.subtle.digest('SHA-256', new TextEncoder().encode(token))
  .then(h => [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''));
let adminPw = lsGet('xmas-admin') || '';

let sb = null;
const sbP = new Promise(resolve => {
  const tryInit = (n = 0) => {
    if (window.supabase && window.supabase.createClient) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
      resolve(sb);
    } else if (n < 100) setTimeout(() => tryInit(n + 1), 100);
    else resolve(null);
  };
  tryInit();
});

// ---------- 小工具 ----------
const isPrivate = p => p.startsWith('data/users/');
const colOf = p => isPrivate(p) ? p.split('/').slice(0, 3).join('/') : p.split('/')[0];
const snapOf = (path, data) => ({ id: path.split('/').pop(), exists: data !== undefined, data: () => data, metadata: { fromCache: false, hasPendingWrites: false } });
const err = (e) => ({ code: /forbidden|bad token/.test(String(e && e.message)) ? 'invalid_argument' : 'unavailable', message: String(e && e.message || e) });

async function fetchCol(col, filter) {
  const s = await sbP; const uid = await uidP;
  if (isPrivate(col)) {
    const { data, error } = await s.rpc('xmas_private', { token });
    if (error) throw error;
    return (data || []).map(r => ({ path: r.path, data: r.data }));
  }
  let q = s.from('xmas_docs').select('path,data').eq('col', col).order('updated_at', { ascending: false }).limit(400);
  if (filter && filter.f === 'keys' && filter.op === 'array-contains') q = q.filter('data->keys', 'cs', JSON.stringify([filter.v]));
  else if (filter && filter.op === '==') q = q.filter('data->>' + filter.f, 'eq', String(filter.v));
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}
async function fetchDoc(path) {
  if (isPrivate(path)) { const rows = await fetchCol(colOf(path)); const r = rows.find(x => x.path === path); return r ? r.data : undefined; }
  const s = await sbP;
  const { data, error } = await s.from('xmas_docs').select('data').eq('path', path).maybeSingle();
  if (error) throw error;
  return data ? data.data : undefined;
}

// ---------- 即時更新 ----------
const colListeners = new Map();   // col → Set(fn)
const docListeners = new Map();   // path → Set(fn)
const pending = new Map();
function poke(col, path) {
  const run = (key, set) => { if (!set) return; clearTimeout(pending.get(key)); pending.set(key, setTimeout(() => set.forEach(fn => fn()), 250)); };
  run('c:' + col, colListeners.get(col));
  if (path) run('d:' + path, docListeners.get(path));
}
let rtStarted = false;
async function startRealtime() {
  if (rtStarted) return; rtStarted = true;
  const s = await sbP; if (!s) return;
  s.channel('xmas-docs').on('postgres_changes', { event: '*', schema: 'public', table: 'xmas_docs' }, payload => {
    const r = payload.new && payload.new.path ? payload.new : payload.old || {};
    if (r.path) poke(r.col || colOf(r.path), r.path);
  }).subscribe();
  // 保險：每 30 秒重新整理一次（即時連線斷掉時也不會停）
  setInterval(() => { colListeners.forEach((set, col) => poke(col)); docListeners.forEach((set, path) => poke(colOf(path), path)); }, 30000);
}

function docRef(path) {
  return {
    id: path.split('/').pop(), path,
    async get() { return snapOf(path, await fetchDoc(path)); },
    async set(d) {
      const s = await sbP;
      const { error } = await s.rpc('xmas_set', { token, p: path, d });
      if (error) throw err(error);
      poke(colOf(path), path);
    },
    async update(d) { const cur = await fetchDoc(path); if (!cur) throw { code: 'invalid_argument', message: 'missing' }; return this.set({ ...cur, ...d }); },
    async delete() {
      const s = await sbP;
      const { error } = await s.rpc('xmas_delete', { token, p: path });
      if (error) throw err(error);
      poke(colOf(path), path);
    },
    onSnapshot(next, onErr) {
      let last = '__';
      const load = async () => {
        try { const d = await fetchDoc(path); const js = JSON.stringify(d); if (js !== last) { last = js; next(snapOf(path, d)); } }
        catch (e) { console.log('doc', path, e); }
      };
      if (!docListeners.has(path)) docListeners.set(path, new Set());
      docListeners.get(path).add(load); startRealtime(); load();
      return () => docListeners.get(path).delete(load);
    },
    collection(sub) { return colRef(path + '/' + sub); }
  };
}
function colRef(col, filter) {
  return {
    path: col,
    where(f, op, v) { return colRef(col, { f, op, v }); },
    orderBy() { return this; }, limit() { return this; },
    doc(id) { return docRef(col + '/' + (id || Math.random().toString(36).slice(2))); },
    async add(d) { const r = this.doc(); await r.set(d); return r; },
    async get() {
      const rows = await fetchCol(col, filter);
      const docs = rows.map(r => snapOf(r.path, r.data));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => docs.map(d => ({ type: 'added', doc: d })), metadata: {} };
    },
    onSnapshot(next, onErr) {
      let seen = new Map(), first = true;
      const load = async () => {
        try {
          const rows = await fetchCol(col, filter);
          const cur = new Map(rows.map(r => [r.path, JSON.stringify(r.data)]));
          const data = new Map(rows.map(r => [r.path, r.data]));
          const changes = [];
          for (const [p, js] of cur) {
            if (!seen.has(p)) changes.push({ type: 'added', doc: snapOf(p, data.get(p)) });
            else if (seen.get(p) !== js) changes.push({ type: 'modified', doc: snapOf(p, data.get(p)) });
          }
          for (const [p, js] of seen) if (!cur.has(p)) changes.push({ type: 'removed', doc: snapOf(p, JSON.parse(js)) });
          seen = cur;
          if (changes.length || first) {
            first = false;
            const docs = [...cur.keys()].map(p => snapOf(p, data.get(p)));
            next({ docs, size: docs.length, empty: !docs.length, docChanges: () => changes, metadata: { fromCache: false } });
          }
        } catch (e) { console.log('col', col, e); }
      };
      if (!colListeners.has(col)) colListeners.set(col, new Set());
      colListeners.get(col).add(load); startRealtime(); load();

  const buildPeers = () => Object.entries(ch.presenceState()).map(([key, metas]) => {

  ch.on('broadcast', { event: '*' }, ({ event, payload }) => {

  });

    presence: async patch => { state = { ...state, ...patch }; if (ready) await ch.track({ ...state, by: uid }); },

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function pbkdf2(pw, salt, usage) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, usage === 'bits' ? ['deriveBits'] : ['deriveKey']);

}

  const bits = await pbkdf2(pw, enc.encode('xmas-tree-lookup-v1'), 'bits');

}

$('sSave').addEventListener('click', async () => {
  const msg = $('sMsg2'); msg.className = 'note';
  const to = $('wTo').value.trim(), text = $('wText').value.trim(), from = $('wFrom').value.trim(), pw = $('wKey').value.trim();
  if (!text) { msg.className = 'note err'; msg.textContent = '先寫下想說的話吧'; return; }
  if (pw.length < 4) { msg.className = 'note err'; msg.textContent = '密語至少要 4 個字'; return; }
  if (!db || !uid || !canWrite || !crypto.subtle) { msg.className = 'note err'; msg.textContent = '你目前沒有權限封存祝福，請分享連結給你的人調整權限'; return; }
  msg.textContent = '封存中……';
  try {
    const k = await lookupId(pw);
    const hit = await db.collection('secrets').where('keys', 'array-contains', k).get();
    if (hit.docs.some(d => d.id !== uid)) { msg.className = 'note err'; msg.textContent = '這個密語已經有人用過了，換一個吧'; return; }
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await pbkdf2(pw, salt, 'key');
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify({ to, text, from, fx: secretFx })));
    const ref = db.doc('secrets/' + uid);
    const cur = await ref.get();
    const d = cur.exists ? cur.data() : {};
    let items = Array.isArray(d.items) ? d.items.filter(it => it && it.k !== k) : [];
    items = [...items, { k, s: b64(salt), iv: b64(iv), c: b64(ct), at: Date.now() }].slice(-20);
    await ref.set({ keys: items.map(it => it.k), items });
    msg.className = 'note ok';
    msg.textContent = `封存好了 ✦ 把密語「${pw}」偷偷告訴${to || '對方'}，請他打開這個連結、按「密語祝福」輸入就能看到`;
    $('wText').value = ''; $('wKey').value = '';
  } catch (e) {
    console.log('secret save', e);
    msg.className = 'note err'; msg.textContent = (e && e.code === 'invalid_argument') ? '你目前沒有權限封存祝福' : '封存失敗了，等一下再試一次';
  }
});

$('sOpen').addEventListener('click', async () => {
  const msg = $('sMsg1'); msg.className = 'note';
  const pw = $('sKey').value.trim();
  if (!pw) return;
  if (!db || !crypto.subtle) { msg.className = 'note err'; msg.textContent = '現在連不上祝福資料，請登入後再試'; return; }
  msg.textContent = '尋找中……';
  try {
    const k = await lookupId(pw);
    const hit = await db.collection('secrets').where('keys', 'array-contains', k).get();
    let found = null;
    for (const d of hit.docs) {
      const it = ((d.data() || {}).items || []).find(x => x && x.k === k);
      if (!it) continue;
      const key = await pbkdf2(pw, unb64(it.s), 'key');
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(it.iv) }, key, unb64(it.c));
      found = JSON.parse(dec.decode(pt));
    }
    if (!found) { msg.className = 'note err'; msg.textContent = '找不到這個密語的祝福，再確認一下？'; return; }
    $('secret').classList.add('hide'); $('sKey').value = ''; $('sKey').blur();

    setTimeout(() => {
      $('lTo').textContent = 'To. ' + (String(found.to || '').slice(0, 20) || '你');
      $('lBody').textContent = String(found.text || '').slice(0, 300);
      $('lFrom').textContent = 'From. ' + (String(found.from || '').slice(0, 20) || '一個在乎你的人');
      $('lPreview').classList.add('hidden');
      $('letter').classList.remove('hide');
    }, 1200);
  } catch (e) { console.log('secret open', e); msg.className = 'note err'; msg.textContent = '找不到這個密語的祝福，再確認一下？'; }
});

let sleigh = null, nextSleigh = 0, gifts = [], sleighTipShown = false;
const GLITTER = ['255,236,180', '255,255,255', null, null];   // null = 主題色

function bez(P, u) {

function newSleigh(now) {
  const sc = W < 600 ? 0.95 : 1.25;
  const ltr = Math.random() < 0.5, loop = Math.random() < 0.35;
  const yMax = H * 0.62;

  const P3 = [ltr ? W + 420 * sc : -420 * sc, rand(0.0, 0.5) * yMax];

  if (loop) { const t = c1[0]; c1[0] = c2[0]; c2[0] = t; c1[1] = rand(0.6, 1) * yMax; c2[1] = rand(0.05, 0.3) * yMax; }   // 交叉的控制點 → 繞一圈
  const P = [P0, c1, c2, P3];

  for (let i = 1; i <= 240; i++) { const q = bez(P, i / 240); lut.push(lut[i - 1] + Math.hypot(q[0] - prev[0], q[1] - prev[1])); prev = q; }

    const next = { n: myDoc.n + 1, ts: [...myDoc.ts.slice(-19), Date.now()] };
    myDoc = next;

    if (text) await db.collection('data/users/' + uid).doc('w' + Date.now()).set({ text, at: Date.now() });

}

    myBless = [...myBless.slice(-2), { t, at }];
    await db.doc('blessings/' + uid).set({ list: myBless });
  } catch (e) { if (e && e.code === 'invalid_argument') canWrite = false; blessPool.push({ t, at, owner: uid || 'local' }); }
}

function cleanWish(d) {
  const n = clamp(Math.floor(Number(d && d.n) || 0), 0, 1000);
  const ts = Array.isArray(d && d.ts) ? d.ts.filter(t => typeof t === 'number').slice(-20) : [];
  return { n, ts };
}
function cleanBless(d) {
  const list = Array.isArray(d && d.list) ? d.list : [];
  return list.filter(b => b && typeof b.t === 'string').slice(-3).map(b => ({ t: b.t.slice(0, 30), at: Number(b.at) || 0 }));
}
function recompute() {
  let total = 0, rc = 0; const now = Date.now();
  for (const d of docs.values()) { total += d.n; rc += d.ts.filter(t => Math.abs(now - t) < 60000).length; }
  totalWishes = total; recent = rc;
  checkUnlock(true);
}
setInterval(recompute, 2000);

async function showCapsule() {
  // 時光膠囊：找出自己「往年」許下的願望
  try {
    const snap = await db.collection('data/users/' + uid).get();
    const thisYear = new Date(Date.now() + 8 * 3600e3).getUTCFullYear();
    const old = snap.docs.map(d => d.data() || {}).filter(d => typeof d.text === 'string' && d.at && new Date(d.at + 8 * 3600e3).getUTCFullYear() < thisYear)
      .sort((a, b) => b.at - a.at);
    if (!old.length) return;
    const yr = new Date(old[0].at + 8 * 3600e3).getUTCFullYear();
    const box = $('capsule');
    box.innerHTML = '';
    const head = document.createElement('div'); head.textContent = `✉ 時光膠囊打開了。${yr} 年的你，許過這樣的願：`;
    const q = document.createElement('div'); q.className = 'q'; q.textContent = '「' + old[0].text + '」';
    const tail = document.createElement('div'); tail.textContent = '它實現了嗎？'; tail.style.opacity = .7;
    box.append(head, q, tail);
    box.classList.remove('hidden');
  } catch (e) { console.log('capsule', e); }
}

(async () => {
  for (let i = 0; i < 50 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (!window.claude || !window.claude.use) return;
  // 同時在線的人
  window.claude.use('room').then(room => {
    if (!room) return;
    try {
      room.presence({ here: true });
      room.onPeers(change => {
        // 只算真人（不算系統），同一個人開好幾個分頁或裝置只算一次，也不算自己
        const list = (change && Array.isArray(change.peers)) ? change.peers : [];
        const others = new Set();
        for (const p of list) if (p && p.kind === 'viewer' && !p.isMe) others.add(p.by || p.peer);
        peers = 1 + others.size; updateInfo();
      });
    } catch (e) { console.log('room', e); }
  }).catch(() => {});

  try {
    const user = await window.claude.use('user');
    db = await window.claude.use('db');

    isOwner = !!(await user.isOwner());

    db.collection('wishes').onSnapshot(snap => {

        if (ch.type === 'removed') { docs.delete(ch.doc.id); continue; }
        const prev = docs.get(ch.doc.id), cur = cleanWish(ch.doc.data());
        docs.set(ch.doc.id, cur);
        if (ch.doc.id === uid) { if (cur.n > myDoc.n) myDoc = cur; continue; }
        if (!firstSnap && started) {
          const inc = prev ? cur.n - prev.n : cur.n;
          for (let k = 0; k < Math.min(3, inc); k++) setTimeout(() => lightNextOrnament(false), k * 400);
        }
      }
      if (firstSnap) {
        firstSnap = false;
        let t = 0; for (const d of docs.values()) t += d.n;
        litShown = Math.max(litShown, t);
        ORN.forEach(o => { if (!o.litAt) o.litAt = 1; });
        checkUnlock(false);
      }

    }, err => console.log('db', err));

    db.collection('blessings').onSnapshot(snap => {
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') { blessDocs.delete(ch.doc.id); continue; }
        const list = cleanBless(ch.doc.data());
        const prev = blessDocs.get(ch.doc.id) || [];
        blessDocs.set(ch.doc.id, list);
        if (ch.doc.id === uid) { myBless = list; continue; }
        if (started && list.length && (!prev.length || list[list.length - 1].at > prev[prev.length - 1].at)) spawnLantern(list[list.length - 1].t, false, { owner: ch.doc.id, at: list[list.length - 1].at });
      }
      blessPool = [...blessDocs.entries()].flatMap(([id, list]) => list.map(b => ({ ...b, owner: id }))).sort(() => Math.random() - 0.5).slice(0, 200);
    }, err => console.log('bless', err));
  } catch (e) { db = null; console.log(e); }
})();

// ---------- 點擊 / 拖曳 ----------
let down = null, lastX = 0;
cv.addEventListener('pointerdown', e => {
  if (window.extraPointerDown && window.extraPointerDown(e.clientX, e.clientY)) { down = null; return; }
  down = { x: e.clientX, y: e.clientY, moved: false }; lastX = e.clientX;
  const d0 = down;

});
cv.addEventListener('pointermove', e => {

});
function release() {
  if (!down) return;
  if (down.long) { down = null; return; }
  if (!down.moved && started && starLit && window.extraTap && window.extraTap(down.x, down.y)) { down = null; return; }
  if (!down.moved && started && starLit && hitSleigh(down.x, down.y)) { dropGift(); down = null; return; }

}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', release);

// ---------- 繪製 ----------
function drawStar(x, y, r, lit, flash) {
  ctx.save(); ctx.translate(x, y);
  if (lit > 0.01) {
    const R = r * (3 + flash * 6);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, `rgba(${PAL.accent2},${0.9 * lit})`); g.addColorStop(1, `rgba(${PAL.accent},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(${PAL.accent2},${0.6 * lit})`; ctx.lineWidth = 1.2;
    const L = r * (2.6 + Math.sin(performance.now() / 300) * 0.4 + flash * 4);
    ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L, 0); ctx.moveTo(0, -L); ctx.lineTo(0, L); ctx.stroke();
    if (unlocked) {                                     // 信打開後，星星外圈多一道光環
      ctx.strokeStyle = `rgba(${PAL.accent},${0.5 + 0.3 * Math.sin(performance.now() / 400)})`;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, 7); ctx.stroke();
    }
  }
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.42 : r, th = i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(th) * rr, Math.sin(th) * rr);
  }
  ctx.closePath();
  if (lit > 0.01) { ctx.fillStyle = '#fbfdff'; ctx.shadowColor = `rgb(${PAL.accent})`; ctx.shadowBlur = 22 * lit; ctx.fill(); }
  else { ctx.strokeStyle = 'rgba(200,220,240,.35)'; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
}

function drawDreamBackground(a, time) {
  if (a < 0.01) return;
  ctx.save();
  ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#120a2e'); g.addColorStop(0.5, '#2a1546'); g.addColorStop(1, '#3b1f4a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  [['120,220,255', 0.22], ['255,160,220', 0.32], ['190,150,255', 0.42]].forEach(([rgb, yy], k) => {
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 20) {
      const y = H * yy + Math.sin(x / 180 + time * 0.4 + k * 2) * 40 + Math.sin(x / 70 + time * 0.7 + k) * 12;
      x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(${rgb},${0.10 * a})`; ctx.lineWidth = 70; ctx.stroke();
    ctx.strokeStyle = `rgba(${rgb},${0.12 * a})`; ctx.lineWidth = 16; ctx.stroke();
  });
  for (const b of bubbles) {
    b.y -= b.v; b.d += 0.01; if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); }
    const x = (b.x + Math.sin(b.d) * 0.02) * W, y = b.y * H;
    const bg = ctx.createRadialGradient(x - b.r * 0.3, y - b.r * 0.3, 0, x, y, b.r);
    bg.addColorStop(0, `rgba(255,255,255,${0.25 * a})`); bg.addColorStop(0.7, `rgba(200,220,255,${0.05 * a})`); bg.addColorStop(1, `rgba(255,200,240,${0.18 * a})`);
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

let lastFest = 0;
const start = performance.now();
function frame(now) {
  const time = (now - start) / 1000;
  for (const k in w) w[k] += ((k === mode ? 1 : 0) - w[k]) * 0.035;
  starFlash *= 0.95;

  // 聖誕零點：開場後的 90 秒內，所有人的樹一起大放光芒
  const xm = xmasMoment(), since = Date.now() - xm;
  const fest = started && since >= 0 && since < 90000;
  festival += ((fest ? 1 : 0) - festival) * 0.03;
  if (fest && now - lastFest > 260) {
    lastFest = now;
    const o = ORN[Math.random() * M | 0];
    launchMeteor(Math.random() < 0.5 ? () => proj(o.x, o.y, o.z) : (() => { const tx = rand(0, W), ty = rand(0.5, 1) * H; return () => ({ x: tx, y: ty }); })(),
      () => { const p = proj(o.x, o.y, o.z); burst(p.x, p.y, o.col, 10, 0.6); }, 0, { dur: rand(900, 1400) });
  }
  $('big').classList.toggle('on', fest && since < 12000);
  const xmasDay = since >= 0 && since < 86400e3;

  const hype = clamp(Math.max(recent / 6, festival, xmasDay ? 0.35 : 0), 0, 1);

  if (!down) {
    const auto = mode === 'scatter' ? 0.0012 : mode === 'dream' ? 0.002 : mode === 'tree' ? 0.006 : 0.004;
    spin *= 0.94; angle += (typeof window.gestureSpin === 'number') ? window.gestureSpin : auto + spin;
  }
  cosA = Math.cos(angle); sinA = Math.sin(angle);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  const bg = ctx.createRadialGradient(CX, CY + S * 0.6, 0, CX, CY, Math.max(W, H) * 0.8);
  bg.addColorStop(0, PAL.bg[0]); bg.addColorStop(1, PAL.bg[1]);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  drawDreamBackground(w.dream, time);
  if (window.drawBehind) { ctx.save(); try { window.drawBehind(now, time); } catch (e) { console.log(e); } ctx.restore(); }

  ctx.fillStyle = 'rgba(230,245,255,.6)';
  for (const s of snow) {
    s.y += s.v; s.d += 0.01;
    if (s.y > 1) { s.y = -0.02; s.x = Math.random(); }
    ctx.beginPath(); ctx.arc((s.x + Math.sin(s.d) * 0.01) * W, s.y * H, s.r, 0, 7); ctx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';

  if (w.tree > 0.02) {
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      ctx.ellipse(CX, CY + 1.1 * S, S * (0.95 + k * 0.25 + Math.sin(time * 1.5 + k) * 0.03), S * (0.16 + k * 0.05), 0, 0, 7);
      ctx.strokeStyle = `rgba(${PAL.ring},${(0.25 - k * 0.1) * w.tree})`; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  const pick = w.dream > 0.5 ? 'dcol' : w.heart > 0.5 ? 'hcol' : w.star > 0.5 ? 'stcol' : 'col';
  for (const p of P) {
    let tg;
    if (mode === 'dream') {
      const yy = ((p.dy - time * p.rise) % 3.4 + 3.4) % 3.4 - 1.7;
      const a = p.da + time * 0.05;
      tg = [Math.cos(a) * p.dr + Math.sin(time + p.tw) * 0.08, yy, Math.sin(a) * p.dr];
    } else tg = p.T[mode];
    const sp = mode === 'dream' ? p.speed * 0.6 : p.speed;
    p.x += (tg[0] - p.x) * sp; p.y += (tg[1] - p.y) * sp; p.z += (tg[2] - p.z) * sp;
    const q = proj(p.x, p.y, p.z);
    if (D + q.rz < 0.3) continue;
    const tw = 0.55 + 0.45 * Math.sin(time * (3 + hype * 4) + p.tw);
    const sz = p.size * q.f * (mode === 'dream' ? 2.6 : 2.4);
    const base = mode === 'scatter' && !started ? 0.55 : 0.95;
    ctx.globalAlpha = clamp(tw * (0.25 + 0.5 * (1 - q.rz) / 2), 0, 1) * base;
    ctx.drawImage(sprite(p[pick]), q.x - sz, q.y - sz, sz * 2, sz * 2);
  }

  // 一起在看的人：繞著樹轉的小光點
  if (started && peers > 1 && mode !== 'dream') {
    const n = Math.min(peers - 1, 30);
    for (let i = 0; i < n; i++) {
      const a = time * 0.35 + i * Math.PI * 2 / n;
      const q = proj(Math.cos(a) * 1.25, 0.55 + Math.sin(time * 0.8 + i) * 0.25 - (i % 3) * 0.35, Math.sin(a) * 1.25);
      const s = (7 + Math.sin(time * 3 + i) * 2) * q.f;
      ctx.globalAlpha = 0.85;
      ctx.drawImage(sprite('255,245,215'), q.x - s, q.y - s, s * 2, s * 2);
    }
  }

  if (w.tree > 0.3) {
    const glints = 3 + Math.floor(hype * 14);
    for (let k = 0; k < glints; k++) {
      if (Math.random() > 0.35) continue;
      const p = P[Math.random() * N | 0];
      const q = proj(p.x, p.y, p.z);
      const s = rand(4, 10 + hype * 10) * q.f;
      ctx.globalAlpha = rand(0.4, 1) * w.tree;
      ctx.drawImage(sprite('235,248,255'), q.x - s, q.y - s, s * 2, s * 2);
    }
  }

  // 裝飾球
  if (w.tree > 0.02) {
    const sorted = ORN.map((o, i) => ({ o, i, q: proj(o.x, o.y, o.z) })).sort((a, b) => b.q.rz - a.q.rz);
    const litSet = new Set(ORDER.slice(0, festival > 0.5 ? M : Math.min(litShown, M)));
    const extra = litShown > M ? clamp((litShown - M) / M, 0, 1) : 0;
    for (const { o, i, q } of sorted) {
      const back = q.rz > 0 ? 0.45 : 1;
      if (litSet.has(i)) {
        const age = o.litAt > 1 ? (now - o.litAt) / 1000 : 9;
        const pop = age < 1.2 ? (1 - age / 1.2) * 2.2 : 0;
        const flick = 0.75 + 0.25 * Math.sin(time * (2.5 + hype * 10) + o.ph);
        const sz = (12 + hype * 16 + extra * 6 + pop * 16) * q.f * flick;
        ctx.globalAlpha = w.tree * back * clamp(0.7 + hype * 0.3 + pop, 0, 1);
        ctx.drawImage(sprite(o.col), q.x - sz, q.y - sz, sz * 2, sz * 2);
        if (hype > 0.3 && Math.random() < hype * 0.15) {
          ctx.globalAlpha = w.tree * back;
          const L = sz * 1.6;
          ctx.strokeStyle = `rgba(${o.col},.8)`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(q.x - L, q.y); ctx.lineTo(q.x + L, q.y); ctx.moveTo(q.x, q.y - L); ctx.lineTo(q.x, q.y + L); ctx.stroke();
        }
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = w.tree * back * 0.8;
        const r = 4.2 * q.f;
        const g = ctx.createRadialGradient(q.x - r * 0.35, q.y - r * 0.35, 0, q.x, q.y, r);
        g.addColorStop(0, 'rgba(240,248,255,.85)'); g.addColorStop(0.5, 'rgba(150,175,205,.45)'); g.addColorStop(1, 'rgba(70,95,130,.35)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
      }
    }
  }

  // 流星
  ctx.globalAlpha = 1;
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    if (now < m.t0) continue;
    const k = clamp((now - m.t0) / m.dur, 0, 1);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const t = m.target();
    const dx = t.x - m.sx, dy = t.y - m.sy;
    const off = Math.sin(Math.PI * e) * m.curve;
    const hx = m.sx + dx * e - dy * off, hy = m.sy + dy * e + dx * off;
    m.trail.push([hx, hy]); if (m.trail.length > (m.small ? 14 : 26)) m.trail.shift();
    for (let j = 1; j < m.trail.length; j++) {
      const a = j / m.trail.length;
      ctx.strokeStyle = `rgba(${PAL.accent2},${a * 0.8})`;
      ctx.lineWidth = a * (m.small ? 2.5 : 4);
      ctx.beginPath(); ctx.moveTo(m.trail[j-1][0], m.trail[j-1][1]); ctx.lineTo(m.trail[j][0], m.trail[j][1]); ctx.stroke();
    }
    const hs = m.small ? 12 : 20;
    ctx.drawImage(sprite(PAL.accent2), hx - hs, hy - hs, hs * 2, hs * 2);
    if (Math.random() < 0.7) sparks.push({ x: hx, y: hy, vx: rand(-0.4, 0.4), vy: rand(0, 0.8), life: 1, decay: rand(0.02, 0.04), rgb: PAL.accent2, size: rand(1, 2.5) });
    if (k >= 1) { meteors.splice(i, 1); m.onArrive && m.onArrive(); }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.03; s.vx *= 0.98; s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = s.life;
    const sz = s.size * 2;
    ctx.drawImage(sprite(s.rgb), s.x - sz, s.y - sz, sz * 2, sz * 2);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += 0.025;
    if (r.t >= 1) { rings.splice(i, 1); continue; }
    ctx.globalAlpha = (1 - r.t) * 0.8;
    ctx.strokeStyle = `rgb(${r.rgb})`; ctx.lineWidth = 2 * (1 - r.t);
    ctx.beginPath(); ctx.arc(r.x, r.y, 6 + r.t * 60 * r.power, 0, 7); ctx.stroke();
  }

  updateSleigh(now);
  drawGifts();
  if (window.drawExtras) { ctx.save(); try { window.drawExtras(now, time); } catch (e) { console.log(e); } ctx.restore(); }

  // 飄上天空的祝福
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = `300 ${W < 600 ? 12 : 14}px 'Noto Serif TC', serif`;
  ctx.textAlign = 'center';
  for (let i = lanterns.length - 1; i >= 0; i--) {
    const l = lanterns[i];
    l.y -= l.vy; l.life += 1 / 60;
    const a = clamp(Math.min(l.life / 1.5, (l.y - H * 0.05) / (H * 0.2)), 0, 1);
    if (l.y < H * 0.04) { lanterns.splice(i, 1); continue; }
    const x = l.x + Math.sin(l.life * 0.8 + l.ph) * 10; l.sx = x;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    ctx.drawImage(sprite(l.mine ? PAL.accent : '255,225,170'), x - 12, l.y - 30, 24, 24);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = '#f4faff'; ctx.shadowColor = `rgba(${PAL.accent},.9)`; ctx.shadowBlur = 8;
    ctx.fillText(l.text, x, l.y);
    ctx.shadowBlur = 0;
  }

  ctx.globalAlpha = 1;
  if (w.tree > 0.05) {
    const s = starPos();
    ctx.globalAlpha = w.tree;
    drawStar(s.x, s.y, 14 + Math.sin(time * 2) * 1.5 * starLit + festival * 4, starLit, starFlash + festival * 0.6);
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}
updateInfo();
requestAnimationFrame(frame);
</script>
<script>

   聖誕樹的玩法們：更多選單、鈴鐺、雪花願望、接流星、畫裝飾、
   堆雪人、聖誕合照、年度回顧牆、交換禮物抽籤
   （使用主程式的 ctx、proj、S、CX、CY、W、H、PAL、db、uid…）
   ===================================================================== */
(() => {
// ---------- 樣式 ----------
const css = document.createElement('style');
css.textContent = `

let bell = { swing: 0, v: 0 }, room = null, lastBellToast = 0;

function ringSound() {

    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();

    [[1, .18], [2.01, .08], [2.42, .06], [3.0, .05], [4.53, .03], [5.2, .02]].forEach(([m, v]) => {

}

  const p = bellPos(); burst(p.x, p.y + 10, '255,230,160', 16, 0.7);
  if (fromMe && room) { try { room.emit('bell', { at: Date.now() }); } catch (e) {} }

(async () => {

})();
function drawBell(time) {

  const p = bellPos(), s = k() * (W < 600 ? 1 : 1.1);
  ctx.save(); ctx.globalAlpha = w.tree;

  const body = $('mineBody'); body.innerHTML = '';
  if (!ready() && !localDecos.length) { body.innerHTML = '<div class="note">登入後才能管理你放上去的東西</div>'; return; }
  const myDecos = [...decoList.filter(d => d.mine), ...localDecos];
  body.appendChild(section('🖼 照片和吊飾', myDecos.map(d => row(`<img src="${d.img}" alt=""><div class="txt">${d.kind === 'photo' ? '照片吊飾' : '手繪吊飾'}</div>`, '拿下來', () => removeDeco(d), () => { close('mine'); viewDeco(d); })), '還沒有掛吊飾'));
  const mySm = snowmen.find(s => s.id === uid || s.id === 'me-local');
  const smRows = [];
  if (mySm) {
    const r = row(`<canvas width="88" height="88"></canvas><div class="txt">☃ ${esc(mySm.name || '你的雪人')}</div>`, '收起來', removeSnowman, () => { close('mine'); viewSnowman(mySm); });
    const c = r.querySelector('canvas').getContext('2d');
    c.fillStyle = 'rgba(20,45,80,.8)'; c.beginPath(); c.arc(44, 44, 44, 0, 7); c.fill();
    const rr = mySm.cfg.r, total = rr[0] * 2 + (rr[0] + rr[1]) * 0.8 + (rr[1] + rr[2]) * 0.8 + rr[2] * 1.9;
    drawSnowman(c, 44, 82, 74 / total, mySm.cfg, 0);
    smRows.push(r);
  }
  body.appendChild(section('☃ 雪人', smRows, '還沒有堆雪人'));
  body.appendChild(section('❄ 年度回顧', myMem.map(m => row(`<div class="txt">❄ ${esc(m.t)}</div>`, '移除', () => removeMemory(m.at))), '還沒有寫年度回顧'));
  body.appendChild(section('☁ 祝福', (typeof myBless !== 'undefined' ? myBless : []).map(b => row(`<div class="txt">☁ ${esc(b.t)}</div>`, '移除', () => removeBlessing(b.at))), '還沒有留祝福'));
}
async function loadMyWishes() {
  if (!ready()) return [];
  try {
    const snap = await db.collection('data/users/' + uid).get();
    return snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) })).filter(d => typeof d.text === 'string').sort((a, b) => (b.at || 0) - (a.at || 0));
  } catch (e) { return []; }
}
async function removeWish(wd) {
  try {
    await db.doc('data/users/' + uid + '/' + wd.id).delete();
    if (myDoc && myDoc.n > 0) {                       // 樹上少亮一顆
      myDoc = { n: myDoc.n - 1, ts: myDoc.ts.slice(0, -1) };
      if (myDoc.n > 0) await db.doc('wishes/' + uid).set(myDoc); else await db.doc('wishes/' + uid).delete();
      litShown = Math.max(0, litShown - 1);
    }
  } catch (e) { console.log(e); toast('沒有移除成功，等一下再試', 2500); }
}
function openMine() {
  renderMine(); open('mine');
  loadMyWishes().then(list => {
    const sec = section('✦ 我的願望（只有你看得到）', list.map(wd => row(`<div class="txt">✦ ${esc(wd.text)}</div>`, '移除', () => removeWish(wd))), '你許的願都沒有寫字，或還沒許願');
    const body = $('mineBody'); if (body.firstChild) body.insertBefore(sec, body.firstChild); else body.appendChild(sec);
  });
}

// =====================================================================
// 接上主畫面
// =====================================================================
window.extraTap = (x, y) => {
  if (hitBell(x, y)) { ring(true); return true; }
  const tw = t => Math.max(40, String(t).length * (W < 600 ? 7 : 8));
  for (const f of memFlakes) if (Math.abs(x - f.sx) < tw(f.t) && y > f.y - 34 && y < f.y + 14) { viewText('memory', f); return true; }
  for (const l of lanterns) if (Math.abs(x - l.sx) < tw(l.text) && y > l.y - 34 && y < l.y + 12) { viewText('blessing', { ...l, t: l.text }); return true; }
  if (w.tree > 0.5) {
    for (let i = decoHits.length - 1; i >= 0; i--) { const h = decoHits[i]; if (Math.hypot(h.x - x, h.y - y) < h.r + 6) { viewDeco(h.d); return true; } }
    for (let i = smHits.length - 1; i >= 0; i--) { const h = smHits[i]; if (Math.abs(x - h.x) < h.hw && y > h.y0 && y < h.y1) { viewSnowman(h.s); return true; } }
  }
  return false;
};
window.drawBehind = (now, time) => { drawSnowPile(); };
resize();
window.drawExtras = (now, time) => {
  drawDecos(time);
  drawSnowmen(time);
  drawBell(time);
  drawMemFlakes();
  drawFlakes();
  updateCatch(now);
};
})();

</script>
<script>
/* =====================================================================
   ✋ 手勢控制（用鏡頭）
   ✊ 握拳：聖誕樹　🫰 手指愛心：愛心　✌️ 比耶：星星　🖐 張開手：童話
   手左右移動：轉動聖誕樹
   ===================================================================== */
(() => {
const css = document.createElement('style');
css.textContent = `
  #gestBtn { position: fixed; right: 12px; top: 78px; z-index: 6; width: 36px; height: 36px; padding: 0; opacity: 0; transition: opacity 1.5s; pointer-events: none; font-size: 16px; }
  #gestBtn.on { opacity: 1; pointer-events: auto; }
  #gestBtn.active { box-shadow: 0 0 16px rgba(var(--accent), .8); border-color: rgba(var(--accent2), .9); }
  #gestCam { position: fixed; right: 12px; top: 122px; width: 96px; border-radius: 10px; transform: scaleX(-1); z-index: 5;
    opacity: 0; transition: opacity .8s; border: 1px solid rgba(255,255,255,.2); pointer-events: none; }
  #gestCam.on { opacity: .45; }
  #gestTag { position: fixed; right: 12px; top: 122px; width: 96px; text-align: center; z-index: 6; pointer-events: none;
    font-family: 'Noto Serif TC', serif; font-size: 20px; transform: translateY(78px); opacity: 0; transition: opacity .3s; }
`;
document.head.appendChild(css);

const btn = document.createElement('button'); btn.className = 'pill'; btn.id = 'gestBtn'; btn.title = '手勢'; btn.textContent = '✋';
const video = document.createElement('video'); video.id = 'gestCam'; video.playsInline = true; video.muted = true;
const tag = document.createElement('div'); tag.id = 'gestTag';
document.body.append(btn, video, tag);

// 跟音樂按鈕一起出現
setInterval(() => { const m = document.getElementById('music'); btn.classList.toggle('on', !!(m && m.classList.contains('on'))); }, 500);

let landmarker = null, stream = null, active = false, lastTime = -1, votes = [], raf = 0;
const EMOJI = { tree: '✊', heart: '🫰', star: '✌️', dream: '🖐' };

btn.addEventListener('click', async () => {
  if (active) { stop(); return; }
  btn.textContent = '…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
    video.srcObject = stream; await video.play();
    if (!landmarker) {
      const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
        runningMode: 'VIDEO', numHands: 1
      });
    }
    active = true; btn.textContent = '✋'; btn.classList.add('active'); video.classList.add('on');
    toast('手勢開啟了 ✋<br><span style="font-size:12px;opacity:.8">✊ 握拳：聖誕樹　🫰 手指愛心：愛心<br>✌️ 比耶：星星　🖐 張開手：童話<br>手左右移動可以轉動樹</span>', 6000);
    loop();
  } catch (e) {
    console.log(e); stop();
    toast('沒辦法打開鏡頭<br><span style="font-size:12px;opacity:.8">請確認瀏覽器允許使用相機</span>', 3500);
  }
});

function stop() {
  active = false; cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  btn.textContent = '✋'; btn.classList.remove('active'); video.classList.remove('on'); tag.style.opacity = 0;
  window.gestureSpin = undefined; votes = [];
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function classify(lm) {
  const wrist = lm[0], hand = dist(wrist, lm[9]) || 1e-6;            // 手掌大小，讓判斷不受遠近影響
  const ext = [[8, 6], [12, 10], [16, 14], [20, 18]].map(([tip, pip]) => dist(lm[tip], wrist) > dist(lm[pip], wrist) * 1.15);
  const n = ext.filter(Boolean).length;
  const othersFolded = !ext[1] && !ext[2] && !ext[3];
  // 🫰 手指愛心：中指、無名指、小指收起；拇指和食指指尖靠在一起，而且食指沒有縮進掌心
  const pinch = dist(lm[4], lm[8]) / hand;
  const indexOut = dist(lm[8], wrist) > dist(lm[5], wrist) * 1.1;
  const thumbOut = dist(lm[4], wrist) > dist(lm[3], wrist);
  if (othersFolded && pinch < 0.45 && indexOut && thumbOut) return 'heart';
  if (n >= 4) return 'dream';                                          // 🖐
  if (ext[0] && ext[1] && !ext[2] && !ext[3]) return 'star';           // ✌️
  if (n === 0) return 'tree';                                          // ✊
  return null;
}

function loop() {
  if (!active) return;
  raf = requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastTime) return;
  lastTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, performance.now()); } catch (e) { return; }
  if (res && res.landmarks && res.landmarks.length) {
    const lm = res.landmarks[0];
    const g = classify(lm);
    votes.push(g); if (votes.length > 6) votes.shift();
    const ok = typeof started !== 'undefined' && started && starLit && !(window.__catching);
    if (g && ok && votes.length >= 5 && votes.every(v => v === g) && mode !== g) {
      setMode(g); burst(innerWidth / 2, innerHeight * 0.4, PAL.accent2, 30, 1);
    }
    tag.textContent = g ? EMOJI[g] : '';
    tag.style.opacity = g ? 1 : 0.3;
    window.gestureSpin = ok ? (lm[9].x - 0.5) * 0.05 : undefined;
  } else {
    votes = []; window.gestureSpin = undefined; tag.style.opacity = 0;
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && active) stop(); });
})();

</script>
</body>
